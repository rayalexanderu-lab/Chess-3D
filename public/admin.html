<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - spellingwork.com</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #09090b; color: #f4f4f5; }
      .container { max-width: 900px; margin: 40px auto; padding: 20px; }
      .card { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
      h1, h2 { margin-top: 0; }
      input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0 14px; border-radius: 6px; border: 1px solid #3f3f46; background: #09090b; color: #fff; }
      button { padding: 9px 14px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-right: 6px; }
      .btn-primary { background: #16a34a; color: #fff; }
      .btn-warn { background: #eab308; color: #000; }
      .btn-ban { background: #dc2626; color: #fff; }
      .btn-gray { background: #3f3f46; color: #fff; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { text-align: left; padding: 10px; border-bottom: 1px solid #27272a; font-size: 0.92rem; }
      .badge { background: #16a34a33; color: #4ade80; padding: 4px 10px; border-radius: 999px; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Login Screen -->
      <div id="login-box" class="card" style="max-width: 400px; margin: 80px auto;">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email" />
        <input type="password" id="password" placeholder="Admin Password" />
        <button class="btn-primary" id="login-btn" style="width:100%;">Sign In</button>
        <p id="login-error" style="color:#ef4444; font-size:0.9rem;"></p>
      </div>

      <!-- Protected Dashboard -->
      <div id="dashboard" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
          <h1>spellingwork.com Admin</h1>
          <div>
            <span class="badge" id="online-count">0 Online</span>
            <button class="btn-gray" id="logout-btn" style="margin-left:10px;">Logout</button>
          </div>
        </div>

        <!-- Global Broadcast -->
        <div class="card">
          <h2>Site-Wide Broadcast</h2>
          <input type="text" id="broadcast-input" placeholder="Type announcement banner for all players..." />
          <button class="btn-primary" id="send-broadcast">Send Broadcast</button>
          <button class="btn-gray" id="clear-broadcast">Clear Banner</button>
        </div>

        <!-- Active Visitors -->
        <div class="card">
          <h2>Live Players on Site</h2>
          <table>
            <thead>
              <tr>
                <th>Device ID</th>
                <th>Device Type</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="visitors-table"></tbody>
          </table>
        </div>

        <!-- Banned Devices -->
        <div class="card">
          <h2>Banned Devices</h2>
          <table>
            <thead>
              <tr>
                <th>Banned Device ID</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="bans-table"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://gstatic.com";
      import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://gstatic.com";
      import { getDatabase, ref, set, onValue, remove } from "https://gstatic.com";

      const firebaseConfig = {
        apiKey: "AIzaSyCXBFLnp-R7KsDEASEUFmbF73yv8e0FtYE",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebaseio.com",
        projectId: "chess-a3fe5",
        storageBucket: "chess-a3fe5.firebasestorage.app",
        messagingSenderId: "382185933860",
        appId: "1:382185933860:web:2e89b7ef6160c0d3879cb1",
        measurementId: "G-D8EMM67HSX"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);

      document.getElementById("login-btn").onclick = async () => {
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;
        try {
          await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) {
          document.getElementById("login-error").textContent = err.message;
        }
      };

      document.getElementById("logout-btn").onclick = () => signOut(auth);

      onAuthStateChanged(auth, (user) => {
        if (user) {
          document.getElementById("login-box").style.display = "none";
          document.getElementById("dashboard").style.display = "block";
          loadAdminListeners();
        } else {
          document.getElementById("login-box").style.display = "block";
          document.getElementById("dashboard").style.display = "none";
        }
      });

      function loadAdminListeners() {
        document.getElementById("send-broadcast").onclick = () => {
          const text = document.getElementById("broadcast-input").value.trim();
          if (text) set(ref(db, "announcements/global"), { text, time: Date.now() });
        };

        document.getElementById("clear-broadcast").onclick = () => {
          remove(ref(db, "announcements/global"));
          document.getElementById("broadcast-input").value = "";
        };

        onValue(ref(db, "active_sessions"), (snap) => {
          const data = snap.val() || {};
          const keys = Object.keys(data);
          document.getElementById("online-count").textContent = `${keys.length} Online`;
          const tbody = document.getElementById("visitors-table");
          tbody.innerHTML = "";
          keys.forEach((id) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td><code>${id}</code></td>
              <td>${data[id].deviceType || "Unknown"}</td>
              <td>
                <button class="btn-warn" data-warn="${id}">Warn</button>
                <button class="btn-ban" data-ban="${id}">Ban</button>
              </td>
            `;
            tbody.appendChild(tr);
          });

          tbody.querySelectorAll("[data-warn]").forEach((btn) => {
            btn.onclick = () => {
              const target = btn.getAttribute("data-warn");
              const msg = prompt(`Send warning message to ${target}:`);
              if (msg) set(ref(db, `warnings/${target}`), msg);
            };
          });

          tbody.querySelectorAll("[data-ban]").forEach((btn) => {
            btn.onclick = () => {
              const target = btn.getAttribute("data-ban");
              if (confirm(`Ban device ${target} from spellingwork.com?`)) {
                set(ref(db, `bans/${target}`), true);
              }
            };
          });
        });

        onValue(ref(db, "bans"), (snap) => {
          const data = snap.val() || {};
          const tbody = document.getElementById("bans-table");
          tbody.innerHTML = "";
          Object.keys(data).forEach((id) => {
            if (data[id] === true) {
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td><code>${id}</code></td>
                <td><button class="btn-gray" data-unban="${id}">Unban</button></td>
              `;
              tbody.appendChild(tr);
            }
          });

          tbody.querySelectorAll("[data-unban]").forEach((btn) => {
            btn.onclick = () => {
              const target = btn.getAttribute("data-unban");
              remove(ref(db, `bans/${target}`));
            };
          });
        });
      }
    </script>
  </body>
</html>
